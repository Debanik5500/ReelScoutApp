name: ReelScoutApp
options:
  bundleIdPrefix: com.reelscout
  deploymentTarget:
    iOS: "17.0"
  swiftVersion: "5.9"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    DEVELOPMENT_TEAM: ""
    GENERATE_INFOPLIST_FILE: false
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: -Onone
      ENABLE_TESTABILITY: YES
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: -O

targets:
  ReelScoutApp:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Core
      - path: Components
      - path: Domain
      - path: Services
      - path: Features
      - path: Assets.xcassets
        buildPhase: resources
      - path: "Preview Content.xcassets"
        buildPhase: resources
      - path: Config/Platforms.json
        name: Platforms.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reelscout.app
        PRODUCT_NAME: Kept
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: ReelScoutApp.entitlements
        ENABLE_PREVIEWS: "YES"
    dependencies:
      - target: ShareExtension
        embed: true

  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      - path: Core/AppGroup.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reelscout.app.ShareExtension
        PRODUCT_NAME: ShareExtension
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: ShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtension.entitlements
        GENERATE_INFOPLIST_FILE: false

schemes:
  Kept:
    build:
      targets:
        ReelScoutApp: all
        ShareExtension: all
    run:
      config: Debug
      executable: ReelScoutApp
    archive:
      config: Release
